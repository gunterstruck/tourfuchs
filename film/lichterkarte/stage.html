<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Werbefilm Lichterkarte – Bühne</title>
<!-- Gestaltungsvorlage für den Werbefilm „Lichterkarte“ (9:16, WhatsApp-Status).
     Wird per Playwright zu PNGs gerendert (render-graphics.mjs).
     Parameter: ?layout=phone|desktop&part=bg|frame|mask|text|intro|outro&scene=lights|zoom|tap|out -->
<style>
@font-face { font-family: 'Nunito'; font-weight: 600; src: url('fonts/Nunito-600.woff2') format('woff2'); }
@font-face { font-family: 'Nunito'; font-weight: 800; src: url('fonts/Nunito-800.woff2') format('woff2'); }
@font-face { font-family: 'Nunito'; font-weight: 900; src: url('fonts/Nunito-900.woff2') format('woff2'); }
:root {
  --night: #07060f; --indigo: #15132c; --violet: #8b5cf6; --teal: #2dd4bf; --blue: #60a5fa;
  --gold: #fde047; --white: #ffffff; --muted: #b9b5d9;
  --aurora: linear-gradient(120deg, #14b8a6 0%, #3b82f6 50%, #8b5cf6 100%);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: var(--w); height: var(--h); overflow: hidden; background: transparent; }
body { font-family: 'Nunito', 'Liberation Sans', sans-serif; color: var(--white); position: relative; }
.layer { position: absolute; inset: 0; display: none; }
body[data-part="bg"] .bg, body[data-part="frame"] .frame, body[data-part="text"] .text,
body[data-part="intro"] .intro, body[data-part="outro"] .outro, body[data-part="mask"] .mask { display: block; }

/* Nachthimmel mit Aurora-Schleiern */
.bg, .intro, .outro {
  background:
    radial-gradient(900px 700px at 15% -5%, rgba(45, 212, 191, 0.22), transparent 62%),
    radial-gradient(1100px 800px at 95% 0%, rgba(139, 92, 246, 0.38), transparent 62%),
    radial-gradient(1000px 700px at 50% 108%, rgba(59, 130, 246, 0.22), transparent 60%),
    linear-gradient(180deg, #120f2b 0%, var(--night) 75%);
}
.star { position: absolute; border-radius: 50%; background: #fff; }
.brand { position: absolute; display: flex; align-items: center; gap: 18px; font-weight: 900; letter-spacing: .4px; }
.brand img { border-radius: 18px; box-shadow: 0 6px 18px rgba(0,0,0,.5), 0 0 26px rgba(139,92,246,.35); }
.brand em { font-style: normal; background: var(--aurora); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand small { display: block; font-weight: 600; color: var(--muted); letter-spacing: 0; }
.pills { position: absolute; display: flex; gap: 14px; flex-wrap: wrap; }
.pill { padding: 10px 22px; border-radius: 999px; background: rgba(255,255,255,.06); border: 2px solid rgba(196,181,253,.25); font-weight: 800; color: #e9e6fb; white-space: nowrap; }
.pill b { color: var(--teal); }
.pills.compact .pill { padding: 8px 16px; }

/* Handy: Rahmen mit ausgestanztem Bildschirm */
.screen-hole { position: absolute; border-radius: 52px; box-shadow: 0 0 0 200px #0b0a14; }
.phone-shell { position: absolute; border-radius: 74px; overflow: hidden; }
.phone-glow { position: absolute; border-radius: 80px; box-shadow: 0 30px 90px rgba(0,0,0,.7), 0 0 70px rgba(139,92,246,.35), 0 0 0 3px rgba(196,181,253,.14) inset; }
.island { position: absolute; background: #050409; border-radius: 22px; }
.side-btn { position: absolute; background: #2a2742; border-radius: 4px; }

/* Texte */
.headline { position: absolute; font-weight: 900; line-height: 1.08; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
.headline .glow { color: var(--gold); text-shadow: 0 0 26px rgba(253,224,71,.55), 0 4px 24px rgba(0,0,0,.6); }
.sub { position: absolute; font-weight: 700; color: #ddd8ff; line-height: 1.3; }
.cta { display: inline-block; padding: 20px 44px; border-radius: 999px; background: var(--aurora); font-weight: 900; box-shadow: 0 0 0 2px rgba(196,181,253,.35), 0 12px 40px rgba(99,102,241,.5); }
.center { text-align: center; left: 0; right: 0; }
.credit { position: absolute; left: 0; right: 0; text-align: center; color: rgba(185,181,217,.7); font-weight: 600; }
</style>
</head>
<body>
<div class="layer bg" id="bg"></div>
<div class="layer frame" id="frame"></div>
<div class="layer text" id="text"></div>
<div class="layer intro" id="intro"></div>
<div class="layer outro" id="outro"></div>
<div class="layer mask" id="mask"></div>
<script>
const q = new URLSearchParams(location.search);
const part = q.get('part') || 'bg';
const scene = q.get('scene') || 'lights';
const layout = q.get('layout') || 'phone';
const PHONE = layout === 'phone';
const W = PHONE ? 1080 : 1920, H = PHONE ? 1920 : 1080;
document.documentElement.style.setProperty('--w', W + 'px');
document.documentElement.style.setProperty('--h', H + 'px');
document.body.dataset.part = part;

// Bildschirmfläche im Bild – Seitenverhältnis wie die Aufnahme
// (Handy 390 × 844, Monitor 1280 × 800)
const GEO = PHONE
  ? { screen: { x: 258, y: 168, w: 564, h: 1220 }, bezel: 18 }
  : { screen: { x: 720, y: 96, w: 1120, h: 700 }, bezel: 20 };
window.GEO = GEO;

const T = {
  brand: 'Tour<em>Fuchs</em>',
  brandSmall: 'Kunden sehen. Tour planen.',
  scenes: {
    lights: ['Jeder <span class="glow">Lichtpunkt</span><br>ein Kunde.', 'Ganz Deutschland auf einen Blick.'],
    zoom: ['Wo es leuchtet,<br>sitzt dein Geschäft.', 'Je größer das Licht, desto mehr Umsatz.'],
    tap: [PHONE ? 'Antippen –<br>alles da.' : 'Anklicken –<br>alles da.', 'Kontakt, Umsatz, letzter Besuch – ab in die Tour.'],
    out: ['Gut vorbereitet<br>hinfahren.', 'Kundenkarte · Tourplanung · KI‑Briefing'],
  },
  introTitle: 'Deine Kunden.<br><span style="color:var(--gold);text-shadow:0 0 30px rgba(253,224,71,.55)">Bei Nacht.</span>',
  introSub: 'Die Lichterkarte von TourFuchs',
  outroTitle: 'Jetzt einfach<br>ausprobieren',
  url: 'tourfuchs.vercel.app',
  outroHint: PHONE ? '👇 Link unten im Status' : 'Läuft im Browser – am PC und als App auf dem Handy',
  outroPills: ['<b>✓</b> Frei nutzbar', '<b>✓</b> Im Browser', '<b>✓</b> Daten bleiben bei dir'],
  credit: 'Musik: „Tropical Island House 2024“ – Sascha Ende (ende.app), CC BY 4.0',
};

const ICON = '../../public/icons/icon-512.png';
const el = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const add = (layer, html) => document.getElementById(layer).appendChild(el(html));

// Sterne: fest verteilt (gleiches Bild bei jedem Rendern)
function stars(layer) {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) {
    const r = 1 + rnd() * 2.6, o = 0.25 + rnd() * 0.55;
    add(layer, `<div class="star" style="left:${(rnd() * W) | 0}px;top:${(rnd() * H) | 0}px;width:${r}px;height:${r}px;opacity:${o};box-shadow:0 0 ${r * 4}px rgba(196,181,253,.6)"></div>`);
  }
}

function brand(layer, x, y, size) {
  add(layer, `<div class="brand" style="left:${x}px;top:${y}px;font-size:${size}px">
    <img src="${ICON}" width="${size * 2}" height="${size * 2}" alt="">
    <div>${T.brand}<small style="font-size:${size * 0.6}px">${T.brandSmall}</small></div></div>`);
}

function pills(layer, y, size, list, left = null) {
  const pos = left === null ? 'left:0;right:0;justify-content:center' : `left:${left}px;width:620px;gap:10px`;
  add(layer, `<div class="pills${left === null ? '' : ' compact'}" style="${pos};top:${y}px;font-size:${size}px">${list.map(p => `<span class="pill">${p}</span>`).join('')}</div>`);
}

if (part === 'bg') {
  stars('bg');
  if (PHONE) brand('bg', 60, 44, 34);
  else { brand('bg', 90, 92, 34); pills('bg', 950, 20, T.outroPills, 90); }
  const s = GEO.screen;
  add('bg', `<div style="position:absolute;left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px;background:#0b0a14;border-radius:${PHONE ? 52 : 8}px"></div>`);
}

if (part === 'frame' && !PHONE) {
  // Monitor: schmaler Rahmen, Kinn, Fuß
  const s = GEO.screen, b = GEO.bezel;
  const o = { x: s.x - b, y: s.y - b, w: s.w + 2 * b, h: s.h + 2 * b + 30 };
  add('frame', `<div class="phone-glow" style="border-radius:28px;left:${o.x - 5}px;top:${o.y - 5}px;width:${o.w + 10}px;height:${o.h + 10}px"></div>`);
  add('frame', `<div class="phone-shell" style="border-radius:24px;left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;border:3px solid #3b3758">
    <div class="screen-hole" style="border-radius:8px;left:${b - 3}px;top:${b - 3}px;width:${s.w}px;height:${s.h}px"></div></div>`);
  const cx = s.x + s.w / 2;
  add('frame', `<div style="position:absolute;left:${cx - 6}px;top:${o.y + o.h - 24}px;width:12px;height:12px;border-radius:50%;background:#2a2742;box-shadow:0 0 8px rgba(139,92,246,.6)"></div>`);
  add('frame', `<div style="position:absolute;left:${cx - 55}px;top:${o.y + o.h}px;width:110px;height:120px;background:linear-gradient(180deg,#2a2742,#16142a);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)"></div>`);
  add('frame', `<div style="position:absolute;left:${cx - 200}px;top:${o.y + o.h + 116}px;width:400px;height:22px;border-radius:12px;background:linear-gradient(180deg,#34304f,#16142a);box-shadow:0 16px 40px rgba(0,0,0,.55), 0 0 30px rgba(139,92,246,.25)"></div>`);
}

if (part === 'frame' && PHONE) {
  const s = GEO.screen, b = GEO.bezel;
  const o = { x: s.x - b, y: s.y - b, w: s.w + 2 * b, h: s.h + 2 * b };
  add('frame', `<div class="phone-glow" style="left:${o.x - 6}px;top:${o.y - 6}px;width:${o.w + 12}px;height:${o.h + 12}px"></div>`);
  add('frame', `<div class="phone-shell" style="left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;border:3px solid #3b3758">
    <div class="screen-hole" style="left:${b - 3}px;top:${b - 3}px;width:${s.w}px;height:${s.h}px"></div></div>`);
  // Kamera-Insel statt Kerbe – wirkt wie ein aktuelles Smartphone
  add('frame', `<div class="island" style="left:${s.x + s.w / 2 - 70}px;top:${s.y + 14}px;width:140px;height:40px"></div>`);
  add('frame', `<div class="side-btn" style="left:${o.x + o.w - 1}px;top:${o.y + 260}px;width:7px;height:120px"></div>`);
  add('frame', `<div class="side-btn" style="left:${o.x - 6}px;top:${o.y + 220}px;width:7px;height:80px"></div>`);
}

if (part === 'text') {
  const [head, sub] = T.scenes[scene] || T.scenes.lights;
  if (PHONE) {
    add('text', `<div class="headline center" style="top:1446px;font-size:74px;padding:0 50px">${head}</div>`);
    add('text', `<div class="sub center" style="top:1650px;font-size:38px;padding:0 70px">${sub}</div>`);
  } else {
    // Überschrift und Unterzeile im Fluss: Die Unterzeile rutscht mit, wenn die Überschrift umbricht.
    add('text', `<div style="position:absolute;left:90px;top:300px;width:600px">
      <div class="headline" style="position:static;font-size:70px">${head}</div>
      <div class="sub" style="position:static;margin-top:34px;font-size:34px">${sub}</div></div>`);
  }
}

if (part === 'mask') {
  const s = GEO.screen;
  document.documentElement.style.setProperty('--w', s.w + 'px');
  document.documentElement.style.setProperty('--h', s.h + 'px');
  document.body.style.background = '#000';
  add('mask', `<div style="position:absolute;inset:0;background:#fff;border-radius:${PHONE ? 52 : 8}px"></div>`);
}

if (part === 'intro' || part === 'outro') {
  stars(part);
  const isIntro = part === 'intro';
  const iconSize = PHONE ? (isIntro ? 280 : 210) : (isIntro ? 220 : 170);
  const top = PHONE ? (isIntro ? 430 : 360) : (isIntro ? 230 : 110);
  add(part, `<div class="center" style="position:absolute;top:${top}px"><img src="${ICON}" width="${iconSize}" height="${iconSize}" style="border-radius:${iconSize * 0.22}px;box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 90px rgba(139,92,246,.45)"></div>`);
  const titleTop = top + iconSize + (PHONE ? 70 : 50);
  add(part, `<div class="headline center" style="top:${titleTop}px;font-size:${PHONE ? 96 : 84}px">${isIntro ? T.introTitle : T.outroTitle}</div>`);
  const nextTop = titleTop + (PHONE ? 250 : 215);
  if (isIntro) {
    add(part, `<div class="sub center" style="top:${nextTop}px;font-size:44px">${T.introSub}</div>`);
  } else {
    add(part, `<div class="center" style="position:absolute;top:${nextTop}px"><span class="cta" style="font-size:50px">${T.url}</span></div>`);
    add(part, `<div class="sub center" style="top:${nextTop + (PHONE ? 160 : 130)}px;font-size:${PHONE ? 40 : 34}px">${T.outroHint}</div>`);
    pills(part, nextTop + (PHONE ? 290 : 220), PHONE ? 30 : 26, T.outroPills);
    add(part, `<div class="credit" style="top:${PHONE ? 1840 : 1030}px;font-size:${PHONE ? 22 : 18}px">${T.credit}</div>`);
  }
}
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {}))));
</script>
</body>
</html>

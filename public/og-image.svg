  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="880" cy="174" r="168" fill="#99f6e4" opacity=".50"/>
  <circle cx="1055" cy="345" r="174" fill="#5eead4" opacity=".35"/>
  <circle cx="825" cy="478" r="142" fill="#bfdbfe" opacity=".48"/>


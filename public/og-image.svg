      <rect width="252" height="11" rx="5" fill="#0d9488"/>
      <text x="22" y="51" font-size="15" font-weight="700" fill="#0d9488">BRIEFING BEREIT</text>
      <text x="22" y="81" font-size="23" font-weight="800" fill="#0f172a">Was ist heute wichtig?</text>
      <rect x="22" y="102" width="181" height="8" rx="4" fill="#cbd5e1"/>
      <rect x="22" y="121" width="142" height="8" rx="4" fill="#cbd5e1"/>

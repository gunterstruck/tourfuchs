  <text x="72" y="578" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="22" font-weight="750" fill="#0f766e">tourfuchs.vercel.app</text>

  <!-- Operativer Bogen: Kunde -> Tour -> Briefing -->
  <path d="M768 183 C860 130 1018 188 1043 291 C1060 360 1008 410 932 420" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
  <path d="M768 183 C860 130 1018 188 1043 291 C1060 360 1008 410 932 420" fill="none" stroke="url(#route)" stroke-width="7" stroke-linecap="round" stroke-dasharray="13 12"/>


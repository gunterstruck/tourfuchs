  <text x="151" y="94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" font-weight="750" fill="#0f172a">TourFuchs <tspan fill="#0d9488">Vertrieb</tspan></text>

  <text x="70" y="202" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="55" font-weight="800" fill="#0f172a">Kunden sehen.</text>
  <text x="70" y="270" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="55" font-weight="800" fill="#0d9488">Tour planen.</text>
  <text x="70" y="338" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="55" font-weight="800" fill="#0f172a">Gut vorbereitet hinfahren.</text>
  <text x="72" y="402" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="27" font-weight="650" fill="#334155">Kundenkarte · Tourplanung · Briefing</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#0f766e">
    <rect x="70" y="486" width="198" height="44" rx="22" fill="#fff" stroke="#0d9488" stroke-width="2"/>
    <text x="169" y="514" text-anchor="middle">100 % im Browser</text>
    <rect x="282" y="486" width="183" height="44" rx="22" fill="#fff" stroke="#0d9488" stroke-width="2"/>
